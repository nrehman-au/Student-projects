<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">A customer-product graph used for recommendation</title>
  <desc id="desc">Three customer nodes are connected to three product nodes by purchase edges. A dashed edge shows a possible product recommendation inferred from the graph.</desc>
  <rect width="900" height="410" rx="18" fill="#f8fafc"/>
  <text x="155" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17365d">Customers</text>
  <text x="745" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17365d">Products</text>
  <g stroke="#7890a8" stroke-width="5" stroke-linecap="round">
    <line x1="190" y1="105" x2="710" y2="105"/>
    <line x1="190" y1="105" x2="710" y2="205"/>
    <line x1="190" y1="205" x2="710" y2="105"/>
    <line x1="190" y1="205" x2="710" y2="305"/>
    <line x1="190" y1="305" x2="710" y2="205"/>
  </g>
  <line x1="190" y1="305" x2="710" y2="305" stroke="#d99b2b" stroke-width="6" stroke-linecap="round" stroke-dasharray="13 12"/>
  <g fill="#1b6a73" stroke="#114e55" stroke-width="3">
    <circle cx="160" cy="105" r="42"/>
    <circle cx="160" cy="205" r="42"/>
    <circle cx="160" cy="305" r="42"/>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="160" y="111">C1</text>
    <text x="160" y="211">C2</text>
    <text x="160" y="311">C3</text>
  </g>
  <g fill="#f2c45b" stroke="#a86f09" stroke-width="3">
    <rect x="702" y="67" width="86" height="76" rx="12"/>
    <rect x="702" y="167" width="86" height="76" rx="12"/>
    <rect x="702" y="267" width="86" height="76" rx="12"/>
  </g>
  <g fill="#17365d" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="745" y="111">P1</text>
    <text x="745" y="211">P2</text>
    <text x="745" y="311">P3</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#425466">
    <line x1="270" y1="370" x2="330" y2="370" stroke="#7890a8" stroke-width="5" stroke-linecap="round"/>
    <text x="345" y="376">observed purchase</text>
    <line x1="530" y1="370" x2="590" y2="370" stroke="#d99b2b" stroke-width="6" stroke-linecap="round" stroke-dasharray="13 12"/>
    <text x="605" y="376">possible recommendation</text>
  </g>
</svg>
