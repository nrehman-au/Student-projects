          - text: "2.2  Predicting traffic speed with graph neural networks"
            href: graph-applications.qmd#project-2-2
          - text: "2.3  Detecting illicit Bitcoin transactions with graphs"
            href: graph-applications.qmd#project-2-3
          - text: "2.4  Recommending movies with graph neural networks"
            href: graph-applications.qmd#project-2-4
          - text: "2.5  Predicting molecular activity with graph neural networks"
            href: graph-applications.qmd#project-2-5
      - section: "3  Machine learning for time series"
        href: time-series-ssl.qmd
        contents:
          - text: "3.1  Recognising activities from wearable sensor data"
            href: time-series-ssl.qmd#project-3-1
          - text: "3.2  Learning from ECG recordings with fewer labels or leads"
            href: time-series-ssl.qmd#project-3-2
