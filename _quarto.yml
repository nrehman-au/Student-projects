format:
  html:
    theme: cosmo
    css: styles-v2.css
    toc: true
    toc-location: right
    toc-depth: 2
    smooth-scroll: true
    link-external-newwindow: true
    code-copy: false
    grid:
      sidebar-width: 275px
      body-width: 860px
      margin-width: 220px
      gutter-width: 1.5rem

execute:
  freeze: auto
