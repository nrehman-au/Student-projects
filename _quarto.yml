project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - industry-partner-projects.qmd
    - graph-applications.qmd
    - time-series-ssl.qmd
    - vision-foundation-models.qmd
    - signal-processing.qmd
    - selection-guidance.qmd
  resources:
    - downloads/

website:
  title: "Student Project Portfolio"
  description: "BSc and MSc projects in industrial machine learning and signal processing, GNN applications, time-series learning, and deep-learning vision"
  site-url: "https://nrehman-au.github.io/Student-projects/"
  search:
    location: navbar
    type: overlay
  reader-mode: true
  back-to-top-navigation: true
  page-navigation: true
  navbar:
    pinned: true
    background: "#17365d"
    foreground: "#ffffff"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Categories"
        menu:
          - text: "1  Industrial projects"
