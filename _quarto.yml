            href: vision-foundation-models.qmd
          - text: "5  Signal processing"
            href: signal-processing.qmd
      - text: "Selection guidance"
        href: selection-guidance.qmd
  sidebar:
    style: "docked"
    collapse-level: 1
    contents:
      - text: "Portfolio overview"
        href: index.qmd
      - section: "1  Industrial projects"
        href: industry-partner-projects.qmd
        contents:
          - text: "1.1  Siemens Gamesa: Data-driven operational state identification"
            href: industry-partner-projects.qmd#project-1-1
